<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>דאשבורד משפחתי</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b78;--line:#e2e8ee;--ac:#0f766e;--bad:#c2410c;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mut:#93a1ae;--line:#26323d;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mut:#93a1ae;--line:#26323d;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:1.2rem;margin:4px 0 12px}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat small{color:var(--mut);display:block;font-size:.75rem}
.stat b{font-size:1.05rem}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.chart{position:relative;height:240px}
.alert{border-inline-start:4px solid var(--bad);padding:8px 10px;margin-bottom:8px;background:var(--bg);border-radius:8px;font-size:.9rem}
.ctl{display:flex;gap:8px;margin-bottom:10px}
input,select{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600}
.src{color:var(--mut);font-size:.75rem;text-align:center;margin:6px 0 14px}
</style>
</head>
<body>
<main>
<h1>דאשבורד משפחתי</h1>
<div class="stats">
<div class="stat"><small>הוצאות</small><b id="exp" class="neg"></b></div>
<div class="stat"><small>הכנסות</small><b id="inc" class="pos"></b></div>
<div class="stat"><small>מאזן</small><b id="bal"></b></div>
</div>
<section class="card"><h2>שינויים בהוראות קבע</h2><div id="alerts"></div></section>
<section class="card"><h2>התפלגות לפי קטגוריה</h2><div class="chart"><canvas id="pie"></canvas></div></section>
<section class="card"><h2>תנועות</h2>
<div class="ctl"><input id="q" type="search" placeholder="חיפוש בית עסק"><select id="cat"><option value="">כל הקטגוריות</option></select></div>
<div class="wrap"><table><thead><tr><th>תאריך</th><th>בית עסק</th><th>קטגוריה</th><th>סכום</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<div class="src" id="src"></div>
</main>
<script>
var SAMPLE={previous:{"נטפליקס":49,"פלאפון":120,"הראל ביטוח":310,"חברת חשמל":410},
transactions:[
{date:"2026-10-02",business:"נטפליקס",amount:59,category:"פנאי",type:"expense"},
{date:"2026-10-03",business:"פלאפון",amount:120,category:"תקשורת",type:"expense"},
{date:"2026-10-04",business:"שופרסל",amount:842,category:"מזון",type:"expense"},
{date:"2026-10-05",business:"חברת חשמל",amount:468,category:"חשבונות",type:"expense"},
{date:"2026-10-07",business:"הראל ביטוח",amount:310,category:"ביטוח",type:"expense"},
{date:"2026-10-09",business:"רמי לוי",amount:615,category:"מזון",type:"expense"},
{date:"2026-10-10",business:"סינמה סיטי",amount:96,category:"פנאי",type:"expense"},
{date:"2026-10-01",business:"משכורת",amount:14500,category:"אחר",type:"income"},
{date:"2026-10-06",business:"לקוח - שעות עבודה",amount:3200,category:"אחר",type:"income"}]};
var COLORS=["#0f766e","#f59e0b","#6366f1","#ec4899","#0ea5e9","#84cc16"];
var D,chart;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return Math.round(n).toLocaleString("he-IL")+" ₪"}
async function load(){try{var r=await fetch("/api/data");if(r.ok){document.getElementById("src").textContent="נתונים עדכניים מהשרת";return await r.json()}}catch(e){}
document.getElementById("src").textContent="נתוני דוגמה. בהרצה על השרת שלך הדף יטען נתונים אמיתיים.";return SAMPLE}
function render(){
var tx=D.transactions,ex=tx.filter(function(t){return t.type!=="income"}),inc=tx.filter(function(t){return t.type==="income"});
var te=ex.reduce(function(s,t){return s+t.amount},0),ti=inc.reduce(function(s,t){return s+t.amount},0);
document.getElementById("exp").textContent=fmt(te);document.getElementById("inc").textContent=fmt(ti);
var b=document.getElementById("bal");b.textContent=fmt(ti-te);b.className=ti-te<0?"neg":"pos";
var al=ex.filter(function(t){var p=D.previous[t.business];return p&&Math.abs(t.amount-p)/p>0.05});
document.getElementById("alerts").innerHTML=al.length?al.map(function(t){var p=D.previous[t.business],d=Math.round((t.amount-p)/p*100);
return '<div class="alert"><b>'+esc(t.business)+'</b>: '+fmt(p)+' ← '+fmt(t.amount)+' ('+(d>0?"+":"")+d+'%)</div>'}).join(""):'<div class="src">אין שינויים חריגים</div>';
var by={};ex.forEach(function(t){by[t.category]=(by[t.category]||0)+t.amount});
var labels=Object.keys(by),css=getComputedStyle(document.documentElement);
if(chart)chart.destroy();
chart=new Chart(document.getElementById("pie"),{type:"doughnut",data:{labels:labels,datasets:[{data:labels.map(function(k){return by[k]}),backgroundColor:COLORS,borderWidth:0}]},
options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:css.getPropertyValue("--tx").trim(),font:{size:12}}}}}});
var sel=document.getElementById("cat");
if(sel.options.length===1)Object.keys(by).forEach(function(k){sel.add(new Option(k,k))});
table()}
function table(){
var q=document.getElementById("q").value.trim(),c=document.getElementById("cat").value;
var rows=D.transactions.filter(function(t){return(!q||t.business.indexOf(q)>-1)&&(!c||t.category===c)}).sort(function(a,b){return a.date<b.date?1:-1});
document.getElementById("rows").innerHTML=rows.map(function(t){var inc=t.type==="income";
return"<tr><td>"+esc(t.date.slice(5).split("-").reverse().join("/"))+"</td><td>"+esc(t.business)+"</td><td>"+esc(t.category)+'</td><td class="'+(inc?"pos":"")+'">'+(inc?"+":"")+fmt(t.amount)+"</td></tr>"}).join("")||'<tr><td colspan="4">לא נמצאו תנועות</td></tr>'}
document.getElementById("q").oninput=table;document.getElementById("cat").onchange=table;
load().then(function(d){D=d;render()});
</script>
</body>
</html>
